# Builds the Stembase installers for Windows, macOS and Linux on GitHub's machines (each system builds its own) and
# publishes them as a GitHub release, with latest.json for the app's Check For Updates.
# Run it from the Actions tab ("Run workflow") after raising the version in ui/src-tauri/tauri.conf.json.
#
# One-time setup in the repository:
# - Secret TAURI_SIGNING_PRIVATE_KEY: the contents of ~/.tauri/stembase.key (signs updates; keep it private).
# - Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD: empty unless you gave the key a password.
# - A release tagged "models" with models.zip: the "models" folder zipped (the Demucs models, about 450 MB).
name: Build and release

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview release (a pre-release: Check For Updates in installed copies doesn't offer it)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-15          # Apple Silicon
            bundles: app,dmg
          - os: macos-15-intel    # Intel
            bundles: app,dmg
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the Demucs models
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models --pattern models.zip --repo "$GITHUB_REPOSITORY"
          unzip -q models.zip && rm models.zip && ls models

      - name: Linux packages for the window (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsndfile1 libfuse2 libtbb12   # libtbb: needed by the engine's libraries

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"   # Intel Mac builds sphn (for Demucs) from source; its CMake recipe is old
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Windows" ]; then
            pip install torch-directml   # GPU on any DirectX 12 card (AMD, Intel, NVIDIA); brings its own torch 2.4
          elif [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu   # CPU build: much smaller
          fi
          touch constraints.txt
          if [ "$RUNNER_OS" = "macOS" ] && [ "$RUNNER_ARCH" = "X64" ]; then
            # Intel Macs: the last releases with ready-made Intel Mac builds (torch 2.2 also needs numpy 1.x).
            for c in 'torch==2.2.2' 'torchaudio==2.2.2' 'numpy<2' 'numba<0.63' 'llvmlite<0.46'; do echo "$c" >> constraints.txt; done
          fi
          pip install -r requirements.txt pyinstaller -c constraints.txt
          pip install --no-deps basic-pitch==0.4.0

      - name: Build the audio engine
        run: python -m PyInstaller stembase_engine.spec --noconfirm

      # AppImage: linuxdeploy checks every library in the bundle, including the engine's own (torch etc.), so it needs
      # to know the folders those are in, at the path they get inside the AppImage.
      - name: Engine library folders for linuxdeploy (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          app="$GITHUB_WORKSPACE/ui/src-tauri/target/release/bundle/appimage/Stembase.AppDir/usr/lib/Stembase/engine"
          dirs=$(cd dist/stembase-engine && find . -name '*.so*' -printf '%h\n' | sort -u | sed "s|^\.|$app|" | paste -sd:)
          echo "LD_LIBRARY_PATH=$dirs" >> "$GITHUB_ENV"
          echo "$dirs" | tr : '\n' | head -20

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Interface packages
        working-directory: ui
        run: npm ci

      - name: Build the app and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true   # AppImage: linuxdeploy's strip fails on some of the engine's libraries
        with:
          projectPath: ui
          tagName: v__VERSION__
          releaseName: Stembase __VERSION__
          releaseBody: See the README for what's new.
          releaseDraft: false
          prerelease: ${{ inputs.preview }}
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} --verbose
